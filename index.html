<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pulso</title>
  <meta name="description" content="Rack de sintetizadores semi-modulares com patch bay, a correr no browser." />
  <meta name="theme-color" content="#16181b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="bar">
      <span class="logo">PULSO</span>
      <button id="play" class="big">▶ Tocar tudo</button>
      <span class="group" id="add-buttons"><span class="group-label">Adicionar</span></span>
      <span class="group">
        <span class="group-label">Aleatório</span>
        <button id="rand-patch" title="Cabos aleatórios entre todos os módulos">⚄ patch</button>
        <button id="rand-seq" title="Sequências aleatórias em todos os módulos">⚄ sequência</button>
        <button id="rand-knobs" title="Knobs aleatórios em todos os módulos">⚄ knobs</button>
      </span>
      <span class="group">
        <button id="clear-cables" title="Tirar todos os cabos">sem cabos</button>
        <button id="zoom-out" title="Diminuir">−</button>
        <span id="zoom-label" class="readout">100%</span>
        <button id="zoom-in" title="Aumentar">+</button>
      </span>
      <span class="group menu-anchor">
        <button id="view-btn" title="Opções visuais">Visual ▾</button>
        <div id="view-menu" hidden>
          <span class="group-label">Skin</span><div id="view-skin" class="group"></div>
          <span class="group-label">Knobs</span><div id="view-knobs" class="group"></div>
          <span class="group-label">Layout</span><div id="view-layout" class="group"></div>
        </div>
      </span>
    </div>
    <div class="bar">
      <span class="group" id="presets"><span class="group-label">Memórias</span></span>
      <span class="group menu-anchor">
        <button id="bank-btn" title="Banco de patches">Banco ▾</button>
        <div id="bank-menu" hidden>
          <div class="bank-row">
            <input id="bank-name" type="text" maxlength="40" placeholder="Nome do patch" aria-label="Nome do patch" />
            <button id="bank-save" class="on">Guardar</button>
          </div>
          <div id="bank-list"></div>
          <div class="bank-row">
            <button id="bank-export" title="Descarregar o banco como ficheiro">Exportar</button>
            <button id="bank-import" title="Juntar patches de um ficheiro">Importar</button>
            <input id="bank-file" type="file" accept="application/json,.json" hidden />
          </div>
          <p id="bank-msg" class="hint"></p>
        </div>
      </span>
      <canvas id="scope" aria-label="Osciloscópio"></canvas>
    </div>
    <p id="patch-hint" class="hint"></p>
  </header>

  <main id="rack-wrap">
    <svg id="cables" aria-hidden="true"></svg>
    <div id="rack"><section id="mixer" class="mixer"></section></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
